<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>هوم HOME | مصنع إبداعات البيت بيتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a25a;--gold-dark:#a8843d;--gold-light:#f0d9a8;--gold-deep:#4a2f08}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:#050201}
body{font-family:'Cairo',sans-serif;color:#f4ecdc;min-height:100vh;background:#050201;overflow-x:hidden;position:relative;z-index:0}
button,input,select{font-family:inherit}
button{cursor:pointer;user-select:none}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(rgba(8,5,2,.82),rgba(8,5,2,.96)),
  radial-gradient(circle at 50% 0%,rgba(255,210,140,.18),transparent 55%),
  url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=2000&q=85') center/cover no-repeat fixed;
  filter:saturate(1.1)}
.shell{position:relative;z-index:1;min-height:100vh}
/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(15,10,5,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,162,90,.35);box-shadow:0 12px 40px -18px rgba(0,0,0,.95)}
.hin{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.crest{position:relative;width:72px;height:72px;flex:0 0 auto;border-radius:50%;background:conic-gradient(from 0deg,#c9a25a,#fff5d0,#a8843d,#fff5d0,#c9a25a);box-shadow:0 0 20px rgba(255,200,120,.5),0 0 40px rgba(255,180,90,.25)}
.crest::before{content:'';position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2a1d10,#140c06)}
.crest::after{content:'';position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff8e0,#ecd9a8 40%,#b8935a 82%,#8a6a2a);display:flex;align-items:center;justify-content:center}
.crest svg{position:absolute;inset:0;margin:auto;width:44px;height:44px;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.bt{display:flex;flex-direction:column;line-height:1}
.bmr{display:flex;align-items:flex-end;gap:10px}
.bm{position:relative;font-size:clamp(30px,4.5vw,42px);font-weight:900;letter-spacing:-2px;line-height:1}
.bm::before{content:attr(data-text);position:absolute;inset:0;z-index:-1;color:var(--gold-deep);text-shadow:0 1px 0 #3d2508,0 2px 0 #3d2508,0 3px 0 #2d1508,0 4px 0 #2d1508,0 6px 8px rgba(0,0,0,.85)}
.bs{background:linear-gradient(180deg,#fff8dd,#f5e0b0 16%,#e8c87a 38%,#d4af65 58%,#a8843d 78%,#6b4f1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,200,120,.4))}
.ben{font-size:clamp(10px,1.3vw,13px);font-weight:800;letter-spacing:4px;color:#c9a25a;padding-bottom:6px;text-shadow:0 0 8px rgba(255,200,120,.4)}
.bdiv{display:flex;align-items:center;gap:6px;margin:5px 0 4px}
.bdiv span{height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(201,162,90,.75),transparent)}
.bdiv i{width:5px;height:5px;background:linear-gradient(135deg,#fff5d0,#c9a25a 55%,#8a6a2a);transform:rotate(45deg);box-shadow:0 0 8px rgba(255,200,120,.8)}
.bsub{font-size:clamp(9px,1.2vw,11.5px);font-weight:700;letter-spacing:1px;color:#e8d5a8;text-shadow:0 1px 4px rgba(0,0,0,.8)}
/* Categories */
.catbar{max-width:1280px;margin:26px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:11px;justify-content:center}
.pill{padding:12px 26px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:linear-gradient(160deg,#fff,#f6f2eb 55%,#efe9df);color:#2b2b2b;font-size:15px;font-weight:800;box-shadow:0 12px 24px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.98),inset 0 -4px 8px rgba(168,132,61,.1);transition:transform .2s,box-shadow .2s,background .25s,color .25s}
.pill:hover{transform:translateY(-2px);box-shadow:0 18px 30px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.98)}
.pill.active{background:linear-gradient(160deg,#3a3a3a,#161616 55%,#000);color:var(--gold-light);border-color:#000;box-shadow:0 16px 32px -12px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.16)}
/* Fabric */
.fsec{max-width:1280px;margin:30px auto 0;padding:0 20px}
.fsec[hidden]{display:none!important}
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fhead span{height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(201,162,90,.7),transparent)}
.fhead h3{font-size:16px;font-weight:900;color:#f2e9d8;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px}
.fbtn{min-height:96px;padding:16px 10px;border-radius:22px;border:1px solid rgba(0,0,0,.08);background:linear-gradient(160deg,#fff,#f7f3ec 55%,#eee7db);color:#2c2c2c;font-size:18px;font-weight:900;box-shadow:0 16px 28px -12px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.98),inset 0 -5px 10px rgba(168,132,61,.13);transition:transform .2s,box-shadow .2s,background .25s,color .25s}
.fbtn:hover{transform:translateY(-3px)}
.fbtn.active{background:linear-gradient(160deg,#3a3a3a,#161616 55%,#000);color:var(--gold-light);border-color:#000;box-shadow:0 20px 36px -14px rgba(0,0,0,.98),inset 0 1px 0 rgba(255,255,255,.16)}
/* Toolbar */
.tb{max-width:1280px;margin:36px auto 0;padding:0 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tb h2{font-size:clamp(18px,2.3vw,24px);font-weight:900;color:#f4ecdc;text-shadow:0 2px 12px rgba(0,0,0,.75)}
.tb h2 span{display:inline-block;margin-inline-start:8px;font-size:12.5px;font-weight:800;color:var(--gold-light);background:rgba(255,255,255,.06);border:1px solid rgba(201,162,90,.5);border-radius:999px;padding:3px 12px;vertical-align:middle}
/* Gallery */
.gwrap{max-width:1280px;margin:18px auto 30px;padding:0 20px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{position:relative;padding:8px;border-radius:24px;background:linear-gradient(160deg,#fff,#fbf8f2 60%,#f5f0e7);box-shadow:0 26px 50px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.98);cursor:pointer;transition:transform .3s,box-shadow .3s;overflow:hidden}
.card:hover{transform:translateY(-5px);box-shadow:0 40px 70px -28px rgba(0,0,0,1),0 0 24px rgba(255,200,120,.12),inset 0 1px 0 rgba(255,255,255,.98)}
.cimg{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#f1ece3}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.cimg img.ld{opacity:1}
.cimg::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,#f1ece3 30%,#e6dfd0 50%,#f1ece3 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;pointer-events:none;transition:opacity .3s}
.cimg.ld::before{opacity:0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.cbody{padding:10px 6px 5px}
.ccap{font-size:13.5px;font-weight:800;color:#3b352d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cprice{margin-top:4px;font-size:13px;font-weight:900;color:#a8843d;display:flex;align-items:center;gap:4px}
.cprice::before{content:'';width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,#f0d9a8,#a8843d)}
.cdel{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:12px;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.55),inset 0 1px 0 #fff;transition:transform .2s,background .2s;z-index:2}
.cdel:hover{transform:scale(1.08);background:#fff1f0}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border-radius:26px;border:2px dashed rgba(201,162,90,.4);background:rgba(20,14,8,.45);color:#d4c9b5;font-size:16px;font-weight:800;line-height:2}
.empty small{display:block;margin-top:8px;font-size:12.5px;font-weight:700;color:#9a9180}
.lmwrap{max-width:1280px;margin:26px auto 120px;padding:0 20px;text-align:center}
.lmbtn{padding:14px 44px;border-radius:16px;border:none;background:linear-gradient(160deg,#3a3a3a,#161616 55%,#000);color:var(--gold-light);font-size:15px;font-weight:900;box-shadow:0 18px 32px -12px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .18s}
.lmbtn:hover{transform:translateY(-2px)}
.lminfo{display:block;margin-top:12px;font-size:12.5px;font-weight:700;color:#c9bfad}
/* Lightbox */
.lb{position:fixed;inset:0;z-index:120;display:none;background:rgba(10,8,6,.95);backdrop-filter:blur(16px);overscroll-behavior:contain;overflow:hidden;touch-action:none}
.lb.open{display:block}
.lbstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:65px 65px 95px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.lbstage.grab{cursor:grabbing}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:0 40px 100px -30px rgba(0,0,0,1);pointer-events:none;will-change:transform,opacity;transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s ease}
.lbstage img.nt{transition:none!important}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;z-index:5;backdrop-filter:blur(10px);transition:background .2s,opacity .2s}
.lbnav:hover{background:rgba(255,255,255,.22)}
.lbnav[disabled]{opacity:.25;pointer-events:none}
.lbnav svg{width:24px;height:24px}
.lbprev{right:18px}
.lbnext{left:18px}
.lbinfo{position:absolute;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;z-index:5;pointer-events:none;padding:0 20px;flex-wrap:wrap}
.lbcap{color:#f2e9d8;font-size:14px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.9);max-width:70%;text-align:center;line-height:1.4}
.lbcnt{padding:4px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#fff;font-size:12px;font-weight:800;backdrop-filter:blur(8px);white-space:nowrap;direction:ltr}
.lbclose{position:absolute;top:18px;left:18px;width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;font-size:24px;font-weight:900;line-height:1;display:grid;place-items:center;z-index:6;backdrop-filter:blur(10px);transition:background .2s,transform .2s}
.lbclose:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}
/* Admin Modal */
.modal{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:18px;background:rgba(12,10,7,.8);backdrop-filter:blur(12px)}
.modal.open{display:grid}
.panel{position:relative;width:100%;max-width:720px;max-height:88vh;overflow-y:auto;padding:26px 24px 28px;border-radius:26px;background:linear-gradient(170deg,#fff,#fdfbf7);box-shadow:0 60px 120px -30px rgba(0,0,0,1),inset 0 1px 0 #fff}
.closex{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:13px;border:1px solid rgba(0,0,0,.05);background:linear-gradient(160deg,#fff,#f3eee6);color:#4a4a4a;font-size:20px;font-weight:900;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.35),inset 0 1px 0 #fff;transition:transform .2s}
.closex:hover{transform:rotate(90deg)}
.atitle{font-size:21px;font-weight:900;color:#1c1c1c;margin-bottom:4px;padding-inline-end:44px}
.asub{font-size:13px;font-weight:700;color:#9a9184;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:800;color:#454035}
.field label .hint{font-weight:700;color:#b0a696;font-size:11.5px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid #ece6da;background:#fbfaf7;font-size:14.5px;font-weight:700;color:#242424;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.field input:focus,.field select:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(201,162,90,.16)}
.field input[type="file"]{padding:14px;border:2px dashed #e3d9c6;background:#fdfbf6;cursor:pointer}
.field input[type="file"]::file-selector-button{font-family:inherit;font-weight:900;font-size:12.5px;padding:8px 16px;margin-inline-end:10px;border:none;border-radius:10px;background:linear-gradient(160deg,#2f2f2f,#0a0a0a);color:var(--gold-light);cursor:pointer}
.btn1{width:100%;padding:14px;border:none;border-radius:15px;background:linear-gradient(160deg,#333,#111 55%,#000);color:var(--gold-light);font-size:15px;font-weight:900;box-shadow:0 16px 28px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .18s,opacity .18s}
.btn1:hover{transform:translateY(-2px)}
.btn1:disabled{opacity:.55;cursor:wait;transform:none}
.btn2{width:100%;padding:11px;margin-top:8px;border:1.5px solid #ece6da;border-radius:13px;background:#fff;color:#6d6558;font-size:13px;font-weight:800;transition:background .2s}
.btn2:hover{background:#fdfbf6}
.btn2.danger{color:#c0392b;border-color:#f1d6d2}
.btn2.danger:hover{background:#fdf0ee}
.prog{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--gold-dark);text-align:center;min-height:18px;line-height:1.5}
.sinfo{font-size:12px;font-weight:700;color:#7a7264;text-align:center;margin-bottom:12px;padding:9px;background:#fbf6ec;border-radius:11px;border:1px solid rgba(201,162,90,.2);line-height:1.6}
.div{height:1px;margin:20px 0 16px;background:linear-gradient(90deg,transparent,#e9e1d2,transparent)}
.acount{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acount h4{font-size:14px;font-weight:900;color:#2c2c2c}
.acount span{font-size:12px;font-weight:800;color:var(--gold-dark);background:#fbf6ec;border:1px solid rgba(201,162,90,.28);padding:3px 11px;border-radius:999px}
.agal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;margin-bottom:12px}
.ath{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:#f3eee5;box-shadow:0 6px 14px -6px rgba(0,0,0,.3)}
.ath img{width:100%;height:100%;object-fit:cover;display:block}
.ath button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .18s,background .18s;z-index:2}
.ath button:hover{transform:scale(1.1);background:#ffeceb}
.lock{text-align:center;padding:14px 4px 6px}
.licon{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f3ecdd);border:1px solid rgba(201,162,90,.3);box-shadow:0 14px 28px -10px rgba(168,132,61,.5),inset 0 2px 0 #fff}
.lock h3{font-size:19px;font-weight:900;color:#1e1e1e;margin-bottom:6px}
.lock p{font-size:13px;font-weight:700;color:#9a9184;margin-bottom:18px}
.perr{margin-top:10px;font-size:12.5px;font-weight:800;color:#c0392b;min-height:16px}
/* WhatsApp & Top */
.wa{position:fixed;bottom:24px;left:24px;z-index:60;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:linear-gradient(160deg,#3ee06f,#1eb955 45%,#0d8f3c);box-shadow:0 20px 34px -10px rgba(13,143,60,.8),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .25s}
.wa:hover{transform:translateY(-4px) scale(1.05)}
.tt{position:fixed;bottom:26px;right:24px;z-index:59;width:48px;height:48px;border-radius:14px;border:1px solid rgba(201,162,90,.3);background:linear-gradient(160deg,rgba(255,245,225,.15),rgba(20,12,6,.75));color:#e8d5a8;display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(14px);backdrop-filter:blur(8px);box-shadow:0 16px 28px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.15);transition:opacity .3s,visibility .3s,transform .3s}
.tt.show{opacity:1;visibility:visible;transform:none}
@media(max-width:760px){
  .crest{width:56px;height:56px}
  .crest svg{width:34px;height:34px}
  .bm{font-size:26px;letter-spacing:-1px}
  .ben{font-size:9.5px;letter-spacing:2.5px;padding-bottom:3px}
  .bsub{font-size:9px;letter-spacing:.5px}
  .catbar{margin-top:20px;padding:0 14px;gap:9px}
  .pill{padding:10px 17px;font-size:13.5px}
  .fsec{padding:0 14px;margin-top:22px}
  .fgrid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .fbtn{min-height:80px;font-size:15px;border-radius:18px}
  .tb{padding:0 14px;margin-top:28px}
  .gwrap{padding:0 14px}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{padding:6px;border-radius:18px}
  .cimg{border-radius:13px}
  .ccap{font-size:12px}
  .cprice{font-size:11.5px}
  .lmwrap{padding:0 14px;margin-bottom:100px}
  .panel{padding:22px 16px 24px;border-radius:22px}
  .atitle{font-size:19px}
  .wa{width:54px;height:54px;bottom:18px;left:16px}
  .wa svg{width:26px;height:26px}
  .tt{width:44px;height:44px;bottom:20px;right:16px;border-radius:13px}
  .lbstage{padding:52px 12px 90px}
  .lbnav{width:42px;height:42px;border-radius:11px}
  .lbnav svg{width:19px;height:19px}
  .lbprev{right:8px}
  .lbnext{left:8px}
  .lbclose{top:12px;left:12px;width:44px;height:44px;font-size:21px}
  .lbcap{font-size:12.5px}
  .lbcnt{font-size:11.5px}
}
</style>
</head>
<body>

<!-- شريط الأخطاء (يظهر فقط إذا حدث خطأ في الكود) -->
<div id="errbar" style="display:none;background:#c0392b;color:#fff;padding:12px;text-align:center;font-weight:bold;font-size:14px;position:relative;z-index:9999;"></div>

<div class="bg" aria-hidden="true"></div>

<div class="shell">
  <header>
    <div class="hin">
      <div class="brand" id="brandLogo">
        <div class="crest">
          <svg viewBox="0 0 100 72" aria-hidden="true">
            <defs>
              <linearGradient id="sB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e6c0"/><stop offset="1" stop-color="#c9a25a"/></linearGradient>
              <linearGradient id="sS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edd39a"/><stop offset="1" stop-color="#b58e45"/></linearGradient>
              <linearGradient id="sA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8e8"/><stop offset="1" stop-color="#c9a25a"/></linearGradient>
              <linearGradient id="sL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a2f"/><stop offset="1" stop-color="#5a4218"/></linearGradient>
            </defs>
            <rect x="16" y="56" width="7" height="11" rx="2.5" fill="url(#sL)"/>
            <rect x="77" y="56" width="7" height="11" rx="2.5" fill="url(#sL)"/>
            <rect x="19" y="9" width="62" height="32" rx="12" fill="url(#sB)"/>
            <rect x="25" y="14" width="23" height="21" rx="8" fill="#fff8ea" opacity=".88"/>
            <rect x="52" y="14" width="23" height="21" rx="8" fill="#fff8ea" opacity=".88"/>
            <rect x="14" y="34" width="72" height="21" rx="9" fill="url(#sS)"/>
            <rect x="22" y="37" width="25" height="15" rx="7" fill="#f9e9c9" opacity=".92"/>
            <rect x="53" y="37" width="25" height="15" rx="7" fill="#f9e9c9" opacity=".92"/>
            <rect x="7" y="27" width="15" height="29" rx="7.5" fill="url(#sA)"/>
            <rect x="78" y="27" width="15" height="29" rx="7.5" fill="url(#sA)"/>
          </svg>

/* ============================================================

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

let webpOk = null;
function supportsWebP(){
  if (webpOk !== null) return webpOk;
  try {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    webpOk = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  } catch(e) { webpOk = false; }
  return webpOk;
}

function loadImg(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('فشل تحميل')); };
    img.src = url;
  });
}

function canvasBlob(canvas, type, q){
  return new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('فشل الضغط')), type, q);
  });
}

async function compressImage(file){
  if (!file.type.startsWith('image/')) throw new Error('ليس صورة');
  if (file.size > COMPRESS.MAX_MB * 1048576) throw new Error('الحجم كبير جداً');

  const img = await loadImg(file);
  let w = img.naturalWidth, h = img.naturalHeight;
  if (w > COMPRESS.MAX_W || h > COMPRESS.MAX_H) {
    const r = Math.min(COMPRESS.MAX_W / w, COMPRESS.MAX_H / h);
    w = Math.round(w * r); h = Math.round(h * r);
  }

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);

  let blob, ext;
  if (supportsWebP()) {
    blob = await canvasBlob(canvas, 'image/webp', COMPRESS.QUALITY);
    ext = 'webp';
  } else {
    blob = await canvasBlob(canvas, 'image/jpeg', COMPRESS.QUALITY + 0.06);
    ext = 'jpg';
  }
  canvas.width = 0; canvas.height = 0;
  return { blob, w, h, ext };
}

    if (!lb.el || !lb.el.classList.contains('open')) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowRight') lbGo(lb.i - 1, -1);
    else if (e.key === 'ArrowLeft')  lbGo(lb.i + 1, 1);
  });
}

async function lbOpen(items, i){
  if (!items.length || !lb.el) return;
  if (i < 0 || i >= items.length) i = 0;
  lb.items = items;
  lb.i = -1;
  lb.busy = false;
  lb.drag = false;
  lb.el.classList.add('open');
  document.body.style.overflow = 'hidden';
  await lbShow(i, 0);
}

function lbClose(){
  if(!lb.el) return;
  lb.el.classList.remove('open');
  if(lb.img) lb.img.src = '';
  document.body.style.overflow = '';
  lb.items = [];
  lb.i = 0;
  lb.busy = false;
}

async function lbShow(i, dir){
  if (lb.busy || i < 0 || i >= lb.items.length || !lb.img) return;
  lb.busy = true;
  const img = lb.img;
  const meta = lb.items[i];

  if (dir !== 0) {
    img.classList.remove('nt');
    img.style.transform = 'translateX(' + (dir * -60) + '%)';
    img.style.opacity = '0';
    await wait(LB.OUT);
  }

  img.classList.add('nt');
  img.style.transform = 'translateX(' + (dir !== 0 ? dir * 60 : 0) + '%)';
  img.style.opacity = dir !== 0 ? '0' : '1';

  await new Promise(res => {
    const done = () => { img.removeEventListener('load', done); img.removeEventListener('error', done); res(); };
    img.addEventListener('load', done);
    img.addEventListener('error', done);
    img.src = meta.url;
    if (img.complete) res();
  });

  lb.i = i;
  if(lb.cnt) lb.cnt.textContent = (i + 1) + ' / ' + lb.items.length;
  if(lb.cap) lb.cap.textContent = meta.title || '';
  if(lb.prev) lb.prev.disabled = i <= 0;
  if(lb.next) lb.next.disabled = i >= lb.items.length - 1;

  void img.offsetHeight;
  img.classList.remove('nt');
  img.style.transform = 'translateX(0)';
  img.style.opacity = '1';

  await wait(dir !== 0 ? LB.IN : 50);
  lb.busy = false;
}

function lbGo(i, dir){
  if (lb.busy || i < 0 || i >= lb.items.length) return;
  lbShow(i, dir);
}

function lbPD(e){
  if (lb.busy || !lb.el.classList.contains('open') || lb.items.length < 2) return;
  lb.drag = true;
  lb.pid = e.pointerId;
  lb.sx = e.clientX;
  lb.sy = e.clientY;
  lb.dx = 0; lb.dy = 0; lb.axis = null;
  if(lb.img) lb.img.classList.add('nt');
  if(lb.stage) lb.stage.classList.add('grab');
  try { if(lb.stage) lb.stage.setPointerCapture(e.pointerId); } catch(_) {}
}

function lbPM(e){
  if (!lb.drag || e.pointerId !== lb.pid) return;
  const dx = e.clientX - lb.sx;
  const dy = e.clientY - lb.sy;
  lb.dx = dx; lb.dy = dy;
  if (!lb.axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    lb.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (lb.axis === 'x' && lb.img) {
    let d = dx;
    if ((lb.i === 0 && d > 0) || (lb.i === lb.items.length - 1 && d < 0)) d *= 0.35;
    lb.img.style.transform = 'translateX(' + d + 'px)';
    lb.img.style.opacity = String(1 - Math.min(Math.abs(d) / 800, 0.4));
  }
}

function lbPU(e){
  if (!lb.drag || e.pointerId !== lb.pid) return;
  lb.drag = false;
  if(lb.stage) lb.stage.classList.remove('grab');
  if(lb.img) lb.img.classList.remove('nt');

  const dx = lb.dx;
  const axis = lb.axis;
  const canP = lb.i > 0;
  const canN = lb.i < lb.items.length - 1;
  lb.dx = 0; lb.dy = 0; lb.axis = null;

  if (axis === 'x' && Math.abs(dx) > LB.THRESHOLD) {
    if (dx > 0 && canP) { lbShow(lb.i - 1, -1); return; }
    if (dx < 0 && canN) { lbShow(lb.i + 1, 1); return; }
  }
  if(lb.img) {
    lb.img.style.transform = 'translateX(0)';
    lb.img.style.opacity = '1';
  }
}

/* ============================================================
   لوحة التحكم
   ============================================================ */
const amodal = $('#amodal');
let adminPage = 0;

function buildAdminSelects(){
  const s = $('#aCat');
  if(!s) return;
  s.innerHTML = '';
  CATS.filter(c => c.id !== 'all').forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.label;
    s.appendChild(o);
  });
  const f = $('#aFab');
  if(!f) return;
  f.innerHTML = '';
  FABS.filter(x => x.id !== 'all').forEach(x => {
    const o = document.createElement('option');
    o.value = x.id; o.textContent = x.label;
    f.appendChild(o);
  });
  s.addEventListener('change', () => {
    const ff = $('#aFabField');
    if(ff) ff.hidden = s.value !== 'fabrics';
  });
}

function showLock(){ 
  if($('#lockView')) $('#lockView').hidden = false; 
  if($('#setupView')) $('#setupView').hidden = true; 
  if($('#adminView')) $('#adminView').hidden = true; 
  if($('#passInput')) $('#passInput').value = ''; 
  if($('#perr')) $('#perr').textContent = ''; 
}
function showSetup(){ 
  if($('#lockView')) $('#lockView').hidden = true; 
  if($('#setupView')) $('#setupView').hidden = false; 
  if($('#adminView')) $('#adminView').hidden = true; 
}
function showAdmin(){ 
  if($('#lockView')) $('#lockView').hidden = true; 
  if($('#setupView')) $('#setupView').hidden = true; 
  if($('#adminView')) $('#adminView').hidden = false; 
  adminPage = 0; 
  renderAdmin(true); 
  updInfo(); 
}

function openAdmin(){
  if(!amodal) return;
  amodal.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (isAdmin) showAdmin();
  else { showLock(); setTimeout(() => { if($('#passInput')) $('#passInput').focus(); }, 200); }
}

function closeAdmin(){
  if(!amodal) return;
  amodal.classList.remove('open');
  if (!lb.el.classList.contains('open')) document.body.style.overflow = '';
}

function tryLogin(){
  const pi = $('#passInput');
  if (!pi) return;
  if (pi.value === PASSWORD) {
    isAdmin = true;
    if($('#perr')) $('#perr').textContent = '';
    if (!GH.token()) { showSetup(); }
    else { showAdmin(); render(true); }
  } else {
    if($('#perr')) $('#perr').textContent = 'كلمة المرور غير صحيحة';
    pi.value = '';
    pi.focus();
  }
}

async function saveToken(){
  const ti = $('#tokenInput');
  if(!ti) return;
  const t = ti.value.trim();
  if (!t) { if($('#setupProg')) $('#setupProg').textContent = 'التوكن مطلوب'; return; }
  localStorage.setItem('gh_token', t);
  if($('#setupProg')) $('#setupProg').textContent = 'جارٍ التحقق...';
  const ok = await GH.verifyToken();
  if (!ok) {
    localStorage.removeItem('gh_token');
    if($('#setupProg')) $('#setupProg').textContent = 'التوكن غير صالح أو لا يملك صلاحية repo';
    return;
  }
  if($('#setupProg')) $('#setupProg').textContent = 'تم الحفظ بنجاح';
  setTimeout(() => { showAdmin(); render(true); }, 500);
}

function updInfo(){
  const el = $('#sinfo');
  if (!el) return;
  const size = catalog.reduce((s, x) => s + (x.size || 0), 0);
  el.innerHTML = 'الصور: <strong>' + catalog.length + '</strong> — الحجم: <strong>' + fmtSize(size) + '</strong><br><small style="color:#a8843d">GitHub: ' + GH_OWNER + '/' + GH_REPO + '</small>';
}

async function doUpload(){
  const fi = $('#aFiles');
  if(!fi) return;
  const files = Array.from(fi.files || []);
  if (!files.length) { alert('اختر صورة واحدة على الأقل'); return; }

  const cat = $('#aCat').value;
  const sub = cat === 'fabrics' ? $('#aFab').value : null;
  const title = $('#aTitle').value.trim();
  const price = $('#aPrice').value.trim();

  const btn = $('#uploadBtn');
  const prog = $('#prog');
  if(btn) { btn.disabled = true; btn.textContent = 'جارٍ الرفع...'; }

  const total = files.length;
  let ok = 0, fail = 0;
  const newItems = [];

  let cursor = 0;
  const workers = Array.from({ length: Math.min(COMPRESS.CONCURRENCY, files.length) }, () => (async () => {
    while (cursor < files.length) {
      const i = cursor++;
      const file = files[i];
      try {
        const { blob, w, h, ext } = await compressImage(file);
        const fname = uid() + '.' + ext;
        const url = await GH.uploadImage(blob, fname);
        newItems.push({
          id: uid(),
          cat, sub, title, price,
          url,
          path: 'images/' + fname,
          w, h,
          size: blob.size,
          t: Date.now()
        });
        ok++;
      } catch(e) {
        fail++;
        console.warn('فشل:', file.name, e.message);
      }
      if(prog) prog.textContent = 'الرفع: ' + (ok + fail) + '/' + total + ' — نجح ' + ok + (fail ? ' — فشل ' + fail : '');
      await wait(0);
    }
  })());
  await Promise.all(workers);

  if (newItems.length) {
    if(prog) prog.textContent = 'جارٍ تحديث الكتالوج على GitHub...';
    try {
      const merged = newItems.concat(catalog);
      await GH.saveCatalog(merged);
      catalog = merged;
    } catch(e) {
      alert('تم رفع الصور لكن فشل حفظ الفهرس: ' + e.message);
    }
  }

  await reload();
  if(prog) prog.textContent = 'تم رفع ' + ok + ' صورة إلى GitHub بنجاح' + (fail ? ' (فشل ' + fail + ')' : '');
  fi.value = '';
  if($('#aTitle')) $('#aTitle').value = '';
  if($('#aPrice')) $('#aPrice').value = '';
  if(btn) { btn.disabled = false; btn.textContent = 'رفع الصور إلى GitHub'; }
  setTimeout(() => { if(prog && prog.textContent.indexOf('تم رفع') === 0) prog.textContent = ''; }, 6000);
}

async function delItem(meta){
  if (!confirm('حذف هذه الصورة نهائياً من GitHub؟')) return;
  try {
    const fname = meta.path ? meta.path.replace('images/', '') : '';
    if (fname) await GH.deleteImage(fname);
    const merged = catalog.filter(x => x.id !== meta.id);
    await GH.saveCatalog(merged);
    catalog = merged;
    await reload();
  } catch(e) {
    alert('فشل الحذف: ' + e.message);
  }
}

function renderAdmin(reset){
  const ag = $('#agal');
  if(!ag) return;
  if (reset) { adminPage = 0; ag.innerHTML = ''; }
  if($('#aCount')) $('#aCount').textContent = catalog.length;
  if (!catalog.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.style.cssText = 'padding:30px 14px;font-size:12.5px;grid-column:1/-1';
    p.textContent = 'لا توجد صور بعد';
    ag.appendChild(p);
    if($('#aMore')) $('#aMore').hidden = true;
    return;
  }
  const slice = catalog.slice(adminPage * ADMIN_PAGE_SIZE, (adminPage + 1) * ADMIN_PAGE_SIZE);
  const frag = document.createDocumentFragment();
  slice.forEach(m => {
    const th = document.createElement('div');
    th.className = 'ath';
    const im = document.createElement('img');
    im.src = m.url;
    im.alt = m.title || 'صورة';
    im.loading = 'lazy';
    th.appendChild(im);
    const b = document.createElement('button');
    b.type = 'button';
    b.title = 'حذف';
    b.innerHTML = TRASH;
    b.addEventListener('click', () => delItem(m));
    th.appendChild(b);
    frag.appendChild(th);
  });
  ag.appendChild(frag);
  adminPage++;
  const shown = Math.min(adminPage * ADMIN_PAGE_SIZE, catalog.length);
  const more = $('#aMore');
  if(more) {
    if (shown < catalog.length) { more.hidden = false; more.textContent = 'عرض المزيد (' + shown + ' من ' + catalog.length + ')'; }
    else more.hidden = true;
  }
}

/* ============================================================
   تحميل وإعادة عرض
   ============================================================ */
async function reload(){
  catalog = await GH.loadCatalog();
  catalog.sort((a, b) => (b.t || 0) - (a.t || 0));
  render(true);
  if (isAdmin) { renderAdmin(true); updInfo(); }
}

/* ============================================================
   الأحداث
   ============================================================ */
function bindEvents(){
  /* 3 نقرات على الشعار */
  let taps = 0, timer = null;
  const bl = $('#brandLogo');
  if(bl) bl.addEventListener('click', () => {
    taps++;
    clearTimeout(timer);
    if (taps >= TAPS) { taps = 0; clearTimeout(timer); openAdmin(); return; }
    timer = setTimeout(() => { taps = 0; timer = null; }, TAP_WINDOW);
  });

  if($('#aclose')) $('#aclose').addEventListener('click', closeAdmin);
  if(amodal) amodal.addEventListener('click', e => { if (e.target === amodal) closeAdmin(); });
  if($('#loginBtn')) $('#loginBtn').addEventListener('click', tryLogin);
  if($('#passInput')) $('#passInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  if($('#saveTokenBtn')) $('#saveTokenBtn').addEventListener('click', saveToken);
  if($('#tokenInput')) $('#tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });

  if($('#logoutBtn')) $('#logoutBtn').addEventListener('click', () => {
    isAdmin = false;
    showLock();
    render(true);
  });
  if($('#resetTokenBtn')) $('#resetTokenBtn').addEventListener('click', () => {
    if (!confirm('مسح التوكن من هذا الجهاز؟ ستحتاج إدخاله مجدداً.')) return;
    localStorage.removeItem('gh_token');
    showSetup();
  });

  if($('#uploadBtn')) $('#uploadBtn').addEventListener('click', doUpload);
  if($('#aMore')) $('#aMore').addEventListener('click', () => renderAdmin(false));
  if($('#lmbtn')) $('#lmbtn').addEventListener('click', () => render(false));

  const tt = $('#tt');
  if(tt) {
    window.addEventListener('scroll', () => {
      tt.classList.toggle('show', window.scrollY > 400);
    }, { passive: true });
    tt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }
}

/* ============================================================
   التشغيل
   ============================================================ */
async function init(){
  buildCats();
  buildFabs();
  buildAdminSelects();
  lbInit();
  bindEvents();
  updTitle();
  await reload();
  console.log('[هوم] تم التحميل — عدد الصور:', catalog.length);
}

document.addEventListener('DOMContentLoaded', () => {
  try {
    init();
  } catch(err) {
    const el = document.getElementById('errbar');
    el.style.display = 'block';
    el.textContent = 'حدث خطأ أثناء التشغيل: ' + err.message;
  }
});
</script>
